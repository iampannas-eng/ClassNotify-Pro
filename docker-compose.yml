# ClassNotify Pro บนเครื่อง Dell
# รัน:  docker compose up -d
# ดู log: docker compose logs -f app

services:
  db:
    image: postgres:16-alpine
    container_name: classnotify-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: Asia/Bangkok
    volumes:
      - pgdata:/var/lib/postgresql/data
      # รันครั้งแรกตอน volume ว่างเท่านั้น
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # ไม่ expose port 5432 ออกนอกเครื่อง ให้คุยกันผ่าน network ภายใน compose เท่านั้น

  app:
    build: .
    container_name: classnotify-app
    restart: unless-stopped
    env_file: .env
    environment:
      TZ: Asia/Bangkok
    depends_on:
      db:
        condition: service_healthy
    # เปิดให้เข้าจาก LAN ได้ตอนทดสอบ เช่น http://192.168.1.69:8000
    # ถ้าจะให้เข้าได้แค่ผ่าน Cloudflare ให้เปลี่ยนเป็น "127.0.0.1:8000:8000"
    ports:
      - "8000:8000"
    volumes:
      - ./export:/app/export   # แชร์กับ exporter เพื่อส่งสัญญาณ "ข้อมูลเปลี่ยน"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).status==200 else 1)\""]
      interval: 30s
      timeout: 5s
      retries: 3

  # ส่งออก /api/today เป็น today.json ไปที่ Gist (URL คงที่) ทุก 1 นาที และทันทีที่มีการแก้ประกาศ
  # ต้องมี GIST_TOKEN ใน .env จึงจะอัปโหลด; ไม่มีก็ยังเขียน export/today.json ไว้ในเครื่อง
  exporter:
    build: .
    container_name: classnotify-exporter
    restart: unless-stopped
    env_file: .env
    environment:
      TZ: Asia/Bangkok
    depends_on:
      app:
        condition: service_healthy
    command: ["python", "scripts/export_today.py"]
    volumes:
      - ./export:/app/export

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: classnotify-tunnel
    restart: unless-stopped
    # โหมด Quick Tunnel: ฟรี ไม่ต้องมีบัญชี/โดเมน ได้ URL สุ่ม https://xxxx.trycloudflare.com
    # URL จะเปลี่ยนเมื่อ container นี้รีสตาร์ท ดู URL ปัจจุบันด้วย: scripts/tunnel-url.sh
    command: tunnel --no-autoupdate --url http://app:8000
    #
    # ถ้ามีโดเมนบน Cloudflare แล้ว ให้สลับเป็น Named Tunnel (URL ถาวร):
    #   command: tunnel --no-autoupdate run
    #   environment:
    #     TUNNEL_TOKEN: ${TUNNEL_TOKEN}
    #   และใน Cloudflare dashboard ตั้ง Public Hostname -> Service = http://app:8000
    depends_on:
      - app

volumes:
  pgdata:
